<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OmniLease Widget Smoke</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f8fafc;
        color: #111827;
      }

      main {
        max-width: 620px;
        padding: 32px;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 28px;
      }

      p {
        margin: 0;
        color: #4b5563;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Widget smoke host</h1>
      <p>This page loads the embeddable leasing widget with the widgetId query parameter.</p>
    </main>
    <script>
      const widgetId = new URLSearchParams(location.search).get('widgetId');
      if (widgetId) {
        const script = document.createElement('script');
        script.src = '/widget.js';
        script.defer = true;
        script.dataset.widgetId = widgetId;
        document.body.appendChild(script);
      }
    </script>
  </body>
</html>
